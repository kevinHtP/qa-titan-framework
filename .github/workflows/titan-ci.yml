name: Titan Framework CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install

    - name: Run OWASP Juice Shop in Background (Docker)
      run: |
        docker run -d -p 3000:3000 bkimminich/juice-shop
        # Berikan waktu 15 detik agar server lokal benar-benar siap menerima koneksi
        sleep 15

    - name: Run Pytest Security & UI Automation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pytest tests/test_security_login.py -v